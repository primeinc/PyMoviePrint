name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pinned LGPL FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'pymovieprint-ffmpeg-ci'
          ./windows/Prepare-FFmpeg.ps1 -Destination $bin
          & (Join-Path $bin 'ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg failed to start' }
          & (Join-Path $bin 'ffprobe.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFprobe failed to start' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q
